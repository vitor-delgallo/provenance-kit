name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      # Actions are pinned to full commit SHAs (the comment gives the tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Core and dev tools only: the unit tests use fakes for every backend.
      # mypy runs here, without the optional packages; pyproject.toml tells it
      # to ignore their missing imports (the full environment type-checks
      # against them).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format)
        run: ruff format --check .

      - name: Mypy (strict)
        run: mypy

      - name: Unit tests
        run: pytest -m "not integration and not network"

  # Integration tests against the real binaries and the light extras, on
  # Linux, together with the unit tests (some of those, such as the
  # signing-certificate checks, need an extra and run only here). They need
  # no network beyond the downloads below: tests marked `network` skip
  # without --run-network, and the watermark tests skip with a reason
  # because the model weights (about 390 MB) and PyTorch are not installed
  # here; run those locally (docs/DEVELOPMENT.md).
  integration:
    name: integration / ubuntu-latest / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      # FFmpeg: BtbN's LGPL static build of the 8.1 branch, n8.1.3-27-g8dca1586f4,
      # from a month-end release (BtbN prunes its daily releases after about
      # two weeks and has kept every month-end one so far), pinned by SHA-256
      # (the digest GitHub reports for the asset, also in the release's
      # checksums.sha256). The archive is cached under that digest, so the job
      # keeps working once the release is gone; when neither the cache nor
      # the URL has it, the job fails: pin a newer build as described in
      # docs/DEVELOPMENT.md ("FFmpeg in CI").
      FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-10-31-12-59/ffmpeg-n8.1.3-27-g8dca1586f4-linux64-lgpl-8.1.tar.xz
      FFMPEG_SHA256: a64f3171e6ad1f7d358d28890a907ee478c331d1177ec696a93418f79ac3f1f3
      # fpcalc: the Chromaprint 1.6.2 release asset, pinned by SHA-256 (the
      # digest GitHub reports for the asset; same release as on Windows).
      FPCALC_URL: https://github.com/acoustid/chromaprint/releases/download/v1.6.2/chromaprint-fpcalc-1.6.2-linux-x86_64.tar.gz
      FPCALC_SHA256: c968ad4a0821592a79b158fb2e1f46cbe0a22a0a1dbc0743c67d68e75d15d2bb
      # A test that would skip because one of these extras (or the binaries
      # they need) is missing fails instead (tests/support.py), so a broken
      # install cannot pass as a green run of skips.
      PROVENANCE_KIT_TEST_REQUIRE: c2pa,timestamps,image-hash,audio,video
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      # Keyed by the pinned digest: a new pin starts a new cache entry, and
      # the next step checks the digest of a restored archive as well.
      - name: Cache the FFmpeg archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/provenance-kit-ci/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_SHA256 }}

      # Outside the checkout, so the working tree stays clean; the tests find
      # the binaries through the PROVENANCE_KIT_* variables.
      - name: Fetch ffmpeg, ffprobe and fpcalc
        run: |
          set -euo pipefail
          cache="$HOME/.cache/provenance-kit-ci/ffmpeg"
          name="${FFMPEG_URL##*/}"
          if [ ! -f "$cache/$name" ]; then
            mkdir -p "$cache"
            if ! curl -fsSL --retry 3 -o "$cache/$name.part" "$FFMPEG_URL"; then
              echo "::error::The pinned FFmpeg build is neither cached nor downloadable (BtbN may have pruned its release): pin a newer one, see docs/DEVELOPMENT.md"
              exit 1
            fi
            mv "$cache/$name.part" "$cache/$name"
          fi
          echo "$FFMPEG_SHA256  $cache/$name" | sha256sum --check --strict -
          dest="$RUNNER_TEMP/tools"
          mkdir -p "$dest/download"
          tar -xJf "$cache/$name" -C "$dest"
          cd "$dest/download"
          curl -fsSL --retry 3 -o fpcalc.tar.gz "$FPCALC_URL"
          echo "$FPCALC_SHA256  fpcalc.tar.gz" | sha256sum --check --strict -
          tar -xzf fpcalc.tar.gz -C "$dest"
          ffmpeg_bin="$dest/${name%.tar.xz}/bin"
          fpcalc_dir="$dest/${FPCALC_URL##*/}"
          fpcalc_dir="${fpcalc_dir%.tar.gz}"
          {
            echo "PROVENANCE_KIT_FFMPEG=$ffmpeg_bin/ffmpeg"
            echo "PROVENANCE_KIT_FFPROBE=$ffmpeg_bin/ffprobe"
            echo "PROVENANCE_KIT_FPCALC=$fpcalc_dir/fpcalc"
          } >> "$GITHUB_ENV"
          "$ffmpeg_bin/ffmpeg" -hide_banner -version | sed -n 1p
          "$fpcalc_dir/fpcalc" -version

      # Every extra that needs neither PyTorch nor model weights. c2pa-python
      # resolves to 0.38.1 here (docs/THIRD_PARTY.md).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[image-hash,video,audio,c2pa,timestamps,dev]"
          python -m pip list --format=freeze | grep -i -E "^(c2pa-python|cryptography|imagehash|opentimestamps)=="

      - name: Unit and integration tests
        run: pytest -m "not network"
