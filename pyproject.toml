[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "provenance-kit"
dynamic = ["version"]
description = "Building blocks for content provenance and media tracking: invisible watermarks, perceptual hashes, fingerprints, C2PA manifests and OpenTimestamps proofs."
readme = "README.md"
# provenance-kit is MIT; src/provenance_kit/image/_pdq_numpy.py is a port of
# Meta's ThreatExchange PDQ reference code under BSD-3-Clause (notice in that
# file, licence text in LICENSES/). Both texts ship in the wheel and the sdist.
license = "MIT AND BSD-3-Clause"
license-files = ["LICENSE", "LICENSES/ThreatExchange-BSD-3-Clause.txt"]
requires-python = ">=3.11"
authors = [{ name = "Vitor Delgallo" }]
keywords = [
    "provenance",
    "watermarking",
    "perceptual-hash",
    "fingerprinting",
    "c2pa",
    "opentimestamps",
    "media",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia",
    "Topic :: Security",
    "Typing :: Typed",
]
# The core install stays light. Heavy dependencies live in the extras below and
# are imported lazily, inside the backend that needs them.
dependencies = [
    "numpy>=1.24",
    "Pillow>=10.3",
]

[project.optional-dependencies]
# Adobe TrustMark invisible image watermark (PyTorch). omegaconf (a trustmark
# dependency) is listed because the adapter imports it to read the model config.
image-watermark = [
    "trustmark>=0.9.2,<0.10",
    "torch>=2.3.1",
    "omegaconf>=2.1,<3",
]
# Perceptual image hashes: pHash and dHash (imagehash). PDQ needs no extra:
# the core install has a NumPy port of Meta's reference implementation.
image-hash = [
    "imagehash>=4.3.1,<5",
]
# Optional native PDQ backend (pdqhash, Meta's C++ code), preferred by
# PdqHasher("auto") when installed. pdqhash ships wheels for Windows and macOS
# only; on Linux it builds from the source distribution and needs a C++11
# compiler, which is why it is not part of any other extra (not even "all").
# See docs/THIRD_PARTY.md.
pdq-native = [
    "pdqhash>=0.2.7,<0.3",
]
# Frame extraction runs the external ffmpeg/ffprobe binaries; the frame-hash
# fingerprint uses PDQ from the core install. No Python packages.
video = []
# Meta VideoSeal invisible video watermark. The backend loads the TorchScript
# release of the model, which needs only PyTorch (see docs/THIRD_PARTY.md for
# why the heavy `videoseal` PyPI package is not a dependency).
video-watermark = [
    "torch>=2.3.1",
]
# Chromaprint fingerprints run the external fpcalc binary; no Python packages.
audio = []
# Meta AudioSeal invisible audio watermark (PyTorch).
audio-watermark = [
    "audioseal>=0.2.1,<0.3",
    "torch>=2.3.1",
]
# C2PA manifests (c2pa-python, bindings to the c2pa-rs native library).
# cryptography backs LocalKeySigner (c2pa-python itself requires >=41).
c2pa = [
    "c2pa-python>=0.38,<0.39",
    "cryptography>=50.0",
]
# OpenTimestamps. 0.5.0 is the release that hardens proof parsing and
# calendar handling.
timestamps = [
    "opentimestamps>=0.5.0,<0.6",
]
# Every capability. pdq-native is left out on purpose (it needs a C++
# compiler on Linux); add it explicitly: "provenance-kit[all,pdq-native]".
all = [
    "provenance-kit[image-watermark,image-hash,video,video-watermark,audio,audio-watermark,c2pa,timestamps]",
]
# Pinned to the tested minor versions so that a new linter release cannot
# break CI unannounced; bump deliberately.
dev = [
    "mypy>=2.4,<2.5",
    "pytest>=9.0,<10",
    "ruff>=0.17.3,<0.18",
]

[project.urls]
Homepage = "https://github.com/vitor-delgallo/provenance-kit"
Source = "https://github.com/vitor-delgallo/provenance-kit"
Documentation = "https://github.com/vitor-delgallo/provenance-kit/tree/main/docs"
Issues = "https://github.com/vitor-delgallo/provenance-kit/issues"
Changelog = "https://github.com/vitor-delgallo/provenance-kit/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/provenance_kit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/provenance_kit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/SECURITY.md",
    "/LICENSE",
    "/LICENSES",
    "/pyproject.toml",
]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "C4",   # comprehensions
    "RUF",  # ruff-specific
    "S",    # bandit (security)
    "D",    # pydocstyle
    "PT",   # pytest style
    "PL",   # pylint subset
    "TID",  # tidy imports
    "LOG",  # logging
    "G",    # logging format
]
ignore = [
    "PLR0913",  # many keyword-only arguments are fine in configuration APIs
    "PLR2004",  # magic values are clearer than constants in many checks
    "S603",     # subprocess without shell: reviewed; argument lists only (tools.py)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D",        # test docstrings are optional
    "S101",     # assert is the pytest idiom
    "S108",     # temporary paths in tests
    "S311",     # seeded pseudo-random data is the point in tests
    "PT011",    # broad pytest.raises(ValueError) is fine for validation tests
    "PT012",    # context-manager tests need several statements under pytest.raises
    "PLR0915",
    "PLC0415",  # imports inside tests (for skips and fakes)
]

[tool.ruff.format]
docstring-code-format = true
line-ending = "lf"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]

# Optional heavy dependencies ship without type information. Backends import
# them lazily and wrap them behind typed Protocols. cryptography is typed, but
# it is an optional dependency too (extra "c2pa"): CI type-checks the core +
# dev install, where it is absent. ignore_missing_imports only applies when a
# module cannot be found, so with cryptography installed (the full
# environment) mypy still checks every use of it against its own types.
[[tool.mypy.overrides]]
module = [
    "trustmark.*",
    "imagehash.*",
    "pdqhash.*",
    "videoseal.*",
    "audioseal.*",
    "c2pa.*",
    "cryptography.*",
    "opentimestamps.*",
    "torch.*",
    "torchvision.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"]
markers = [
    "integration: needs heavy optional dependencies, model downloads or external binaries; skipped automatically when they are missing",
    "network: needs internet access; skipped unless --run-network is given",
]
